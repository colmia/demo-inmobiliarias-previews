<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Demo inmobiliarias · Colmia</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07110d; color: #f4f8f6; }
      main { width: min(760px, calc(100% - 32px)); padding: 48px; border: 1px solid #244237; border-radius: 24px; background: #0d1b15; }
      p { color: #a9bdb4; line-height: 1.6; }
      .tag { display: inline-block; padding: 7px 11px; border-radius: 999px; background: #183d2c; color: #7ef0b0; font-size: 13px; font-weight: 700; }
      h1 { margin: 22px 0 14px; font-size: clamp(36px, 8vw, 70px); line-height: .94; letter-spacing: -.05em; }
      .status { margin-top: 32px; padding-top: 24px; border-top: 1px solid #244237; }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">ENTORNO DEMO · DATOS FICTICIOS</span>
      <h1>Demo inmobiliarias</h1>
      <p>Base aislada para demostrar atención multicanal, cualificación y coordinación de visitas.</p>
      <p class="status"><strong>Estado:</strong> estructura inicial preparada. El miniCRM todavía no está implementado.</p>
    </main>
  </body>
</html>
